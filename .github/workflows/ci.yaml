name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -l {0}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Micromamba
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: environment.yaml
          environment-name: yt_digest
          cache-environment: true

      - name: Run Ruff
        run: ruff check .

      - name: Run Flake8
        run: flake8 .

      - name: Run Mypy
        run: mypy app.py

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -l {0}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Micromamba
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: environment.yaml
          environment-name: yt_digest
          cache-environment: true

      - name: Run pytest
        run: pytest -v --junitxml=test-results.xml

      - name: Publish Test Results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Pytest Results
          path: test-results.xml
          reporter: java-junit

  docker-build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Load Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: yt-digest:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke Test (Import Check)
        run: docker run --rm yt-digest:test python -c "import app; print('✅ App imports successfully')"

      - name: Run Unit Tests in Docker
        run: docker run --rm --entrypoint pytest yt-digest:test -v
  
  deploy:
    needs: [test, docker-build]
    runs-on: ubuntu-latest
    
    # This prevents running on PRs
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    permissions:
      contents: read
      packages: write
      id-token: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push to ECR
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Uses the registry output from the login step dynamically
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/yt-digest:latest
            ${{ steps.login-ecr.outputs.registry }}/yt-digest:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max